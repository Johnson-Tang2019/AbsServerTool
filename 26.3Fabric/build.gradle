plugins { id 'net.fabricmc.fabric-loom' }

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

sourceSets {
    profilerRegression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        absservertool { sourceSet sourceSets.main }
        absservertool_profiler_regression { sourceSet sourceSets.profilerRegression }
    }
    runs {
        server { server(); runDir 'run' }
        profilerRegression {
            server()
            source sourceSets.profilerRegression
            runDir 'run/profiler-regression'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('prepareProfilerRegression', Copy) {
    from 'src/profilerRegression/server'
    into 'run/profiler-regression'
}

tasks.named('runProfilerRegression') {
    dependsOn 'prepareProfilerRegression'
    doLast {
        def log = file('run/profiler-regression/logs/latest.log')
        if (!log.exists() || !log.text.contains('PROFILER_REGRESSION_PASSED:')) {
            throw new GradleException('Profiler runtime regression did not pass; inspect the test server log.')
        }
    }
}
