plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
    base.archivesName = "absservertool-${project.name}"
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    sourceSets.main.java.srcDir rootProject.file('src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }

subprojects {
    sourceSets {
        categoryVerification {
            java.srcDir rootProject.file('src/verification/java')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    def verifyCategories = tasks.register('verifyWaypointCategories', JavaExec) {
        group = 'verification'
        dependsOn tasks.named('categoryVerificationClasses')
        classpath = sourceSets.categoryVerification.runtimeClasspath
        mainClass = 'abyssredemption.verification.CategoryVerification'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        workingDir = layout.buildDirectory.dir('category-verification').get().asFile
        doFirst { workingDir.mkdirs() }
    }
    tasks.named('check') { dependsOn verifyCategories }
    def verifyExclusions = tasks.register('verifyPlayerExclusions', JavaExec) {
        group = 'verification'
        dependsOn tasks.named('categoryVerificationClasses')
        classpath = sourceSets.categoryVerification.runtimeClasspath
        mainClass = 'abyssredemption.player.ExclusionVerification'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
    tasks.named('check') { dependsOn verifyExclusions }
}
