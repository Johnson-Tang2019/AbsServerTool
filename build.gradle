plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.146' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
    base.archivesName = "absservertool-${project.name}"
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    sourceSets.main.java.srcDir rootProject.file('src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
